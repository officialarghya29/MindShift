name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest joblib

      - name: Lint (syntax + undefined names)
        run: |
          python -m compileall -q cerebro backend evaluation scripts tests
          python -m pyflakes cerebro/ backend/ evaluation/ scripts/ tests/
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if ".git" in p.parts:
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: API tests (stubbed pipeline)
        run: python -m pytest backend/tests -q

      - name: Metric gates (committed published results)
        run: |
          python - <<'EOF'
          import json
          s = json.load(open("evaluation/results/summary.json"))
          assert s["n_test_conversations"] > 0
          fm = s["full_metrics"]
          # sanity gates: saturated corpus — assert the easy things loudly
          assert fm["sentiment"]["f1_macro"] >= 0.95
          assert fm["tension"]["mae"] <= 5.0
          assert fm["sarcasm"]["roc_auc"] >= 0.90
          print("summary gates OK:",
                "sarc-auc", fm["sarcasm"]["roc_auc"],
                "| tension-mae", fm["tension"]["mae"])
          # fusion gate (PS-01 §24): published weights must be a valid simplex
          w = s["fusion_weights"]
          assert abs(sum(w.values()) - 1.0) < 1e-6, w
          assert all(0 <= v <= 1 for v in w.values()), w
          print("fusion gate OK: weights simplex |", s["fusion_tuning_status"])
          sc = json.load(open("evaluation/results/scenarios.json"))
          assert sc["n_passed"] == 20, sc["n_passed"]
          print("scenario gate OK: 20/20 executed")
          ea = s.get("error_analysis", {})
          real = sum(ea.get("real_errors_after_noise_removal", {}).values())
          assert real <= 5, f"real errors regressed: {real}"
          print("error gate OK: real errors =", real)
          bm = json.load(open("evaluation/results/benchmarks.json"))
          flat = bm["scaling"]
          assert flat[-1]["messages_per_second"] >= 100, flat[-1]
          assert bm["memory_1000msg"]["peak_mb"] <= 100, bm["memory_1000msg"]
          print("benchmark gate OK:", flat[-1]["messages_per_second"], "msg/s |",
                bm["memory_1000msg"]["peak_mb"], "MB peak @1k")
          EOF

      - name: Training smoke (tiny corpus, exit-code only)
        run: |
          python - <<'EOF'
          import os, tempfile
          from evaluation import run_full
          # run the smoke into a throwaway results dir: fitting on a tiny corpus
          # produces deliberately bad metrics, and clobbering evaluation/results/
          # would feed those into the graph step below
          tmp = tempfile.mkdtemp(prefix="ci_smoke_")
          run_full.RESULTS_DIR = tmp
          run_full.fit_stage(convs_per_cell=3)
          run_full.eval_stage()
          assert sorted(os.listdir(tmp)), "smoke wrote nothing"
          print("training smoke OK (results isolated to", tmp, ")")
          EOF

      - name: Dataset quality & leakage audit (PS-01 §38)
        run: |
          PYTHONPATH=. python -m evaluation.audit_dataset
          python - <<'EOF'
          import json
          a = json.load(open("evaluation/results/dataset_audit.json"))
          assert a["passed"], a
          sep = a["conversation_level_separation"]
          assert all(v == 0 for v in sep["id_overlaps"].values()), sep
          assert a["duplicate_conversations"]["duplicate_conversations"] == 0
          assert abs(a["split_balance"]["cohens_d"]) < 0.2, a["split_balance"]
          heads = a["label_leakage_empirical"]["heads"]
          assert all(h["classes_absent_from_corpus"] == 0 for h in heads.values()), heads
          print("dataset audit gates OK: 0 split overlap · d =",
                a["split_balance"]["cohens_d"], "· min kappa",
                a["annotation_consistency"]["min_kappa"])
          EOF

      - name: Context-dependence proof gate (PS-01 §3 — the headline claim)
        run: |
          PYTHONPATH=. python -m evaluation.run_context_proof
          python - <<'EOF'
          import json
          r = json.load(open("evaluation/results/context_proof.json"))
          reg = r["regimes"][r["primary_regime"]]
          v, ceil = reg["variants"], reg["text_only_lexical_ceiling"]
          for head in ("sentiment", "emotion", "tone"):
              a = v["A"][head]["accuracy"]
              e = v["E"][head]["accuracy"]
              # the design REQUIRES text-only to sit on the analytic ceiling;
              # if that ever drifts the experiment has silently broken
              assert abs(a - ceil[head]["accuracy"]) < 1e-9, (head, a, ceil[head])
              assert e - a >= 0.20, (head, a, e)
              print(f"  {head}: text-only {a:.4f} == ceiling | full {e:.4f} "
                    f"(+{(e - a) * 100:.1f} pp)")
          print("context proof gate OK — context beats the ceiling-bound reader")
          EOF

      - name: Graphs (full suite + 7 legibility validators per figure)
        run: |
          PYTHONPATH=. python -m evaluation.make_graphs
          test -f docs/architecture/architecture.png && echo "architecture OK (validators passed)"
          test -f assets/graphs/efficiency_benchmarks.png && echo "graphs OK (validators passed)"

      - name: Figure audit (independent of the in-process validators)
        run: python scripts/audit_figures.py

      - name: Docs integrity (links, anchors, figure embeds)
        run: python scripts/audit_docs.py

      - name: Presentation deck regenerates from the measured results
        run: |
          python scripts/make_deck.py
          test -f docs/presentation/slides.html
          python - <<'EOF'
          import json, re
          h = open("docs/presentation/slides.html", encoding="utf-8").read()
          assert h.count('class="slide"') == 10, "expected 10 slides"
          assert not re.findall(r"\{[A-Z_]+\}", h), "unsubstituted placeholder"
          facts = json.load(open("docs/presentation/facts.json"))
          assert facts["context"]["gain_pp"] > 0
          print("deck OK: 10 slides |", facts["context"]["gain_pp"], "pp context gain")
          EOF
